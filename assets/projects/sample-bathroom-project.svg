<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="1000" gradientUnits="userSpaceOnUse">
      <stop stop-color="#eaf3fb"/>
      <stop offset=".48" stop-color="#d6e2ed"/>
      <stop offset="1" stop-color="#0b1f35"/>
    </linearGradient>
    <linearGradient id="glass" x1="320" y1="170" x2="980" y2="830" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#7bc9ff" stop-opacity=".28"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f3d07a"/>
      <stop offset="1" stop-color="#a77a24"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#00101f" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect x="92" y="88" width="1416" height="824" rx="46" fill="#f7fbff" opacity=".78"/>
  <rect x="142" y="130" width="590" height="740" rx="34" fill="#f1f6fb"/>
  <rect x="768" y="130" width="690" height="740" rx="34" fill="#132b45"/>

  <!-- left bathroom wall tiles -->
  <g opacity=".58">
    <path d="M160 250H714" stroke="#c2d2df" stroke-width="3"/>
    <path d="M160 370H714" stroke="#c2d2df" stroke-width="3"/>
    <path d="M160 490H714" stroke="#c2d2df" stroke-width="3"/>
    <path d="M160 610H714" stroke="#c2d2df" stroke-width="3"/>
    <path d="M250 145V856" stroke="#c2d2df" stroke-width="3"/>
    <path d="M390 145V856" stroke="#c2d2df" stroke-width="3"/>
    <path d="M530 145V856" stroke="#c2d2df" stroke-width="3"/>
    <path d="M670 145V856" stroke="#c2d2df" stroke-width="3"/>
  </g>

  <!-- right dark premium panels -->
  <g opacity=".42">
    <path d="M815 210H1410" stroke="#4ea7ff" stroke-width="2"/>
    <path d="M815 350H1410" stroke="#4ea7ff" stroke-width="2"/>
    <path d="M815 490H1410" stroke="#4ea7ff" stroke-width="2"/>
    <path d="M815 630H1410" stroke="#4ea7ff" stroke-width="2"/>
    <path d="M925 155V850" stroke="#4ea7ff" stroke-width="2"/>
    <path d="M1085 155V850" stroke="#4ea7ff" stroke-width="2"/>
    <path d="M1245 155V850" stroke="#4ea7ff" stroke-width="2"/>
  </g>

  <!-- shower glass -->
  <rect x="310" y="180" width="430" height="610" rx="34" fill="url(#glass)" stroke="#ffffff" stroke-width="8" filter="url(#shadow)"/>
  <path d="M700 210C630 310 572 430 546 610" stroke="#ffffff" stroke-opacity=".72" stroke-width="10" stroke-linecap="round"/>
  <circle cx="610" cy="380" r="42" fill="#dfeaf3" stroke="#7b8ea0" stroke-width="8"/>
  <path d="M610 425V560" stroke="#7b8ea0" stroke-width="14" stroke-linecap="round"/>

  <!-- vanity -->
  <rect x="860" y="570" width="490" height="180" rx="28" fill="#eef4f8" filter="url(#shadow)"/>
  <rect x="900" y="610" width="410" height="58" rx="22" fill="#d7e4ee"/>
  <rect x="1010" y="514" width="190" height="38" rx="19" fill="url(#gold)"/>
  <path d="M1105 514V460C1105 433 1127 411 1154 411H1194" stroke="url(#gold)" stroke-width="18" stroke-linecap="round"/>
  <circle cx="1105" cy="695" r="20" fill="#2a4058"/>
  <circle cx="1215" cy="695" r="20" fill="#2a4058"/>

  <!-- mirror -->
  <circle cx="1105" cy="345" r="128" fill="#e8f4ff" stroke="url(#gold)" stroke-width="16" filter="url(#shadow)"/>
  <circle cx="1105" cy="345" r="96" fill="#cce6fb" opacity=".76"/>

  <!-- pipes/design line -->
  <path d="M190 825H1410" stroke="#00b7ff" stroke-width="8" stroke-linecap="round" opacity=".72"/>
  <path d="M190 825C365 738 500 752 650 825C825 910 1010 910 1410 825" stroke="#0a72ff" stroke-width="6" stroke-linecap="round" opacity=".58"/>

  <g filter="url(#shadow)">
    <rect x="104" y="90" width="430" height="104" rx="28" fill="#061528" opacity=".94"/>
    <text x="138" y="135" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#00b7ff">ΔΕΙΓΜΑ ΕΡΓΟΥ</text>
    <text x="138" y="170" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#ffffff">Μπάνιο • Υδραυλικά • Φινίρισμα</text>
  </g>
</svg>